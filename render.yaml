# Render.com deployment config for Katha Backend
# Frontend is deployed separately on Vercel (see frontend/.env.example)
#
# To deploy on Railway instead:
#   1. Connect your GitHub repo
#   2. Add the environment variables below in the Railway dashboard
#   3. Railway auto-detects the Dockerfile and deploys

services:
  - type: web
    name: katha-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        value: sqlite:///./katha.db  # Override with PostgreSQL URL for production persistence
      - key: JWT_SECRET_KEY
        generateValue: true           # Render auto-generates a secure secret
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 10080
      - key: GEMINI_API_KEY
        sync: false                   # Set this in Render dashboard (secret)
      - key: CORS_ORIGINS
        sync: false                   # Set to your Vercel frontend URL, e.g. https://katha.vercel.app
      - key: DEBUG
        value: "false"
    healthCheckPath: /health
    autoDeploy: true
